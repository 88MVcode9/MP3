<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<link rel="icon" href="https://github.com/88MVcode9/IMAGENS/blob/main/favicon/musica.jpeg?raw=true">
<title>Music Downloader</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --accent:#5b8cff; --text:#eef1f7; --muted:#8b93a7; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:640px; margin:60px auto; padding:0 20px; }
  h1 { font-size:1.6rem; margin-bottom:4px; }
  p.sub { color:var(--muted); margin-top:0; }
  .card { background:var(--card); border-radius:14px; padding:22px; margin-top:20px; }
  form { display:flex; gap:10px; }
  input[type=text] { flex:1; padding:12px 14px; border-radius:10px; border:1px solid #2a2f3a; background:#0d0f14; color:var(--text); font-size:1rem; }
  select { padding:12px; border-radius:10px; border:1px solid #2a2f3a; background:#0d0f14; color:var(--text); }
  button { padding:12px 18px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:progress; }
  .resultado { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #262b36; }
  .resultado:last-child { border-bottom:none; }
  .status { margin-top:14px; color:var(--muted); font-size:.9rem; min-height:1.2em; }
  a.baixar { color:var(--accent); text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎵 Music Downloader</h1>
  <p class="sub">Cole um link do YouTube ou busque por título/trecho da letra.</p>

  <div class="card">
    <form id="form-busca">
      <input type="text" id="query" placeholder="Link do YouTube ou nome da música">
      <select id="formato">
        <option value="mp3">MP3</option>
        <option value="mp4">MP4</option>
      </select>
      <button type="submit" id="btn-buscar">Buscar / Baixar</button>
    </form>
    <div class="status" id="status"></div>
    <div id="resultados"></div>
  </div>
</div>

<script>
const form = document.getElementById('form-busca');
const status = document.getElementById('status');
const resultadosEl = document.getElementById('resultados');
const btn = document.getElementById('btn-buscar');

function isUrl(s) { return /^https?:\/\//i.test(s.trim()); }

async function baixar(url) {
  status.textContent = 'Baixando... isso pode levar alguns segundos.';
  btn.disabled = true;
  try {
    const formato = document.getElementById('formato').value;
    const r = await fetch('/api/download', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({url, formato})
    });
    const data = await r.json();
    if (data.erro) { status.textContent = 'Erro: ' + data.erro; return; }
    status.innerHTML = `Pronto! <a class="baixar" href="/api/file/${data.job}/${encodeURIComponent(data.arquivo)}">Clique aqui para baixar</a>`;
  } catch (e) {
    status.textContent = 'Erro de conexão: ' + e;
  } finally {
    btn.disabled = false;
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const query = document.getElementById('query').value.trim();
  if (!query) return;

  if (isUrl(query)) {
    baixar(query);
    return;
  }

  status.textContent = 'Buscando...';
  resultadosEl.innerHTML = '';
  btn.disabled = true;
  try {
    const r = await fetch('/api/search', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({query})
    });
    const data = await r.json();
    if (data.erro) { status.textContent = 'Erro: ' + data.erro; return; }
    status.textContent = data.resultados.length ? 'Escolha um resultado:' : 'Nada encontrado.';
    data.resultados.forEach(res => {
      const div = document.createElement('div');
      div.className = 'resultado';
      div.innerHTML = `<span>${res.titulo}</span>`;
      const b = document.createElement('button');
      b.textContent = 'Baixar';
      b.onclick = () => baixar(res.url);
      div.appendChild(b);
      resultadosEl.appendChild(div);
    });
  } catch (e) {
    status.textContent = 'Erro de conexão: ' + e;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
